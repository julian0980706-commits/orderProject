<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <title>點餐</title>
    <link rel="stylesheet" href="index.css"/>
    <link rel="stylesheet" href="steak.css"/>
</head>
<body style="margin: 0px;"> 
    <div id="main" style="display: none;">
        <h1 style="text-align: center;">波利茶亭</h1>
        <form id="form">
            <div id="op">
                <h2 style="text-align: center;margin: 0;">吃甚麼</h2>
                <div class="e" id="emeal" style="color: red; text-align: center; padding: 10px;">ㄟ你忘記了</div>
                <div style="display: flex; justify-content: center;"><button id="random" type="button">隨機</button></div>
                <label><input type="radio" name="meal" value="白飯10"/>白飯10</label>
                <label><input type="radio" name="meal" value="肉燥飯25"/>肉燥飯25</label>
                <label><input type="radio" name="meal" value="肉鬆飯25"/>肉鬆飯25</label>
                <label><input type="radio" name="meal" value="肉燥肉鬆飯30"/>肉燥肉鬆飯30</label>
                <label><input type="radio" name="meal" value="蛋炒飯(附湯)50"/>蛋炒飯(附湯)50</label>
                <label><input type="radio" name="meal" value="玉米炒飯(附湯)55"/>玉米炒飯(附湯)55</label>
                <label><input type="radio" name="meal" value="鹹蛋炒飯(附湯)55"/>鹹蛋炒飯(附湯)55</label>
                <label><input type="radio" name="meal" value="菜脯炒飯(附湯)55"/>菜脯炒飯(附湯)55</label>
                <label><input type="radio" name="meal" value="鳳梨炒飯(附湯)60"/>鳳梨炒飯(附湯)60</label>
                <label><input type="radio" name="meal" value="泡菜炒飯(附湯)60"/>泡菜炒飯(附湯)60</label>
                <label><input type="radio" name="meal" value="肉絲炒飯(附湯)60"/>肉絲炒飯(附湯)60</label>
                <label><input type="radio" name="meal" value="蛋包飯(附湯)70"/>蛋包飯(附湯)70</label>
                <label><input type="radio" name="meal" value="咖哩炒飯(附湯)60"/>咖哩炒飯(附湯)60</label>
                <label><input type="radio" name="meal" value="香腸炒飯(附湯)65"/>香腸炒飯(附湯)65</label>
                <label><input type="radio" name="meal" value="吻仔魚炒飯(附湯)65"/>吻仔魚炒飯(附湯)65</label>
                <label><input type="radio" name="meal" value="鹹魚炒飯(附湯)65"/>鹹魚炒飯(附湯)65</label>
                <label><input type="radio" name="meal" value="蝦仁炒飯(附湯)70"/>蝦仁炒飯(附湯)70</label>
                <label><input type="radio" name="meal" value="鮭魚炒飯(附湯)70"/>鮭魚炒飯(附湯)70</label>
                <label><input type="radio" name="meal" value="櫻花蝦炒飯(附湯)70"/>櫻花蝦炒飯(附湯)70</label>
                <label><input type="radio" name="meal" value="總匯炒飯(附湯)85"/>總匯炒飯(附湯)85</label>
                <label><input type="radio" name="meal" value="牛肉麵45"/>牛肉麵45</label>
                <label><input type="radio" name="meal" value="肉燥麵45"/>肉燥麵45</label>
                <label><input type="radio" name="meal" value="鮮蝦麵45"/>鮮蝦麵45</label>
                <label><input type="radio" name="meal" value="魚肚粥55"/>魚肚粥55</label>
                <label><input type="radio" name="meal" value="魚皮粥55"/>魚皮粥55</label>
                <label><input type="radio" name="meal" value="鍋燒意麵65"/>鍋燒意麵65</label>
                <label><input type="radio" name="meal" value="鍋燒冬粉60"/>鍋燒冬粉60</label>
                <label><input type="radio" name="meal" value="鍋燒大麵60"/>鍋燒大麵60</label>
                <label><input type="radio" name="meal" value="鍋燒米粉60"/>鍋燒米粉60</label>
                <label><input type="radio" name="meal" value="海產粥60"/>海產粥60</label>
                <label><input type="radio" name="meal" value="炒泡麵(附湯)65"/>炒泡麵(附湯)65</label>
                <label><input type="radio" name="meal" value="炒意麵70"/>炒意麵70</label>
                <label><input type="radio" name="meal" value="炒麵(油麵)(附湯)65"/>炒麵(油麵)(附湯)65</label>
                <label><input type="radio" name="meal" value="炒麵(冬粉)(附湯)65"/>炒麵(冬粉)(附湯)65</label>
                <label><input type="radio" name="meal" value="炒麵(大麵)(附湯)65"/>炒麵(大麵)(附湯)65</label>
                <label><input type="radio" name="meal" value="炒麵(米粉)(附湯)65"/>炒麵(米粉)(附湯)65</label>
                <label><input type="radio" name="meal" value="鐵板麵(黑胡椒)(附湯)65"/>鐵板麵(黑胡椒)(附湯)65</label>
                <label><input type="radio" name="meal" value="鐵板麵(蘑菇)(附湯)65"/>鐵板麵(蘑菇)(附湯)65</label>
                <label><input type="radio" name="meal" value="一口餃(20粒)35"/>一口餃(20粒)35</label>
                <label><input type="radio" name="meal" value="手工水餃(10粒)50"/>手工水餃(10粒)50</label>
                <label><input type="radio" name="meal" value="我不要吃"/>我不要吃</label>
            </div>
            <div class="con" style="flex-direction: column; padding: 0; overflow: hidden; gap: 0;">
                <img src="images/police.webp" alt="菜單圖片" style="width: 100%; height: auto; display: block;">
                <div style="width: 100%; padding: 20px 0; display: flex; justify-content: center;">
                    <input id="extra" type="text" placeholder="加點區" 
                        style="height: 40px; width: 60vw; border-radius: 5px; border: solid black 1px; font-size: 1.3rem; padding: 0 10px; color: black; -webkit-appearance: none;">
                </div>
            </div>
            <div class="con" style="flex-direction: column;">
                <div class="e" id="enum" style="color: red; margin-bottom: 5px;">ㄟ你忘記了</div>
                <input id="text" type="text" placeholder="座號(別班的打名字)" autocomplete="off" autocorrect="off" autocapitalize="off" >
            </div>
            <div class="con">
                <button type="reset" id="restart">重置表單</button>
                <button type="submit" id="sub" style="color: blue;">提交表單</button>  
            </div>
        </form>
    </div>
    <dialog id="dialog" >
        <div id="con"><img src="images/QA6.png"></div>
        <button style="border-radius: 15px; display: block; width: 80px;height: 30px;background-color:rgb(241, 125, 125);margin: 10px auto 10px auto;" id="close">我知道了</button>
    </dialog>
    <div id="animation" style="display: none;">
        <div class="ani-box">
            <h1>表單送出</h1>
            <dotlottie-wc
                src="images/orderAnimation.lottie"
                style="transform: scale(3);margin-top: 100px;"
                autoplay
                loop>
            </dotlottie-wc>
        </div>
    </div>

    <div id="container">
        <button class="box" id="box1">主頁</button>
        <button class="box" id="box2" style="height: 120px;">點餐</button>
        <button class="box" id="box3">點餐紀錄</button>
        <button class="box" id="box4">月曆</button>
    </div>
    <dotlottie-wc
        id="animation_loading"
        src="images/animation.lottie"
        style="width: 420px;height: 480px;display: none;position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 999;"
        autoplay
        loop
    ></dotlottie-wc>
    <script type="module" src="index.js"></script>
    <script type="module" src="police.js"></script>
</body>
</html>
